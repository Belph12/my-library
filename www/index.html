<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f3ee;--card:#ffffff;--ink:#4a4458;--acc:#8f7bd0;--soft:#efe9f6;--ok:#7bb394;--mint:#dcf0e5;--sub:#8a8398}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26232e;--card:#322e3d;--ink:#ece7f3;--acc:#a592e6;--soft:#403b4d;--ok:#8fcfb0;--mint:#2f4a40;--sub:#aaa3b8}}
:root[data-theme="dark"]{--bg:#26232e;--card:#322e3d;--ink:#ece7f3;--acc:#a592e6;--soft:#403b4d;--ok:#8fcfb0;--mint:#2f4a40;--sub:#aaa3b8}
body{margin:0 auto;max-width:560px;padding:14px;color:var(--ink);font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;background:var(--bg)}
h1{font-size:1.2rem;font-weight:800;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:4px}
#sc{border-radius:20px!important;box-shadow:0 8px 24px #4a44581f}
#sc::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,#0000004d 100%)}
nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:12px 0;padding-bottom:4px}

nav button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #4a44580f}
.card::after{content:'';display:block;clear:both}
button.b{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 2px 6px #8f7bd040}
button.b:active{transform:translateY(1px)}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px 12px;margin:4px 0;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:inherit}
.msg{background:var(--mint);color:var(--ink);padding:10px 14px;border-radius:14px;min-height:1.2em}
#menu{background:var(--bg)!important;background-image:none!important}
.sel{outline:3px solid var(--acc);outline-offset:2px}
small{color:var(--sub)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.cv{float:left;width:46px;height:64px;margin:0 12px 4px 0;border-radius:6px 10px 10px 6px;background:linear-gradient(90deg,#00000014 0 9%,#ffffff66 9% 11%,transparent 11%),var(--c,#e3dcd2);box-shadow:0 3px 8px #4a445826;color:#4a4458;font-weight:700;font-size:7px;text-align:center;line-height:1.15;padding:8px 4px 0 10px;box-sizing:border-box;overflow:hidden;position:relative}
.cv i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:14px}

#uploadProgress{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:520px;margin:auto;padding:12px 14px;background:var(--card);color:var(--ink);border:1px solid var(--soft);border-radius:16px;box-shadow:0 8px 28px #0005;font-size:.88rem}
#uploadProgress[style*="display: none"]{display:none!important}
#uploadProgress .up-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
#uploadProgress #upClose{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:28px;height:28px;font-size:20px;line-height:1;cursor:pointer}
#uploadProgress .up-track{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
#uploadProgress #upFill{height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .12s linear}
#uploadProgress #upDetail{margin-top:7px;font-size:.78rem;color:var(--sub)}
#uploadProgress.up-done #upFill{background:#5ca77b}
#uploadProgress.up-error #upFill{background:#d56b75}
#rsPanel button.b,#rsPanel label.b{font-size:.78rem;padding:7px 10px}
#rsPanel select{max-width:100%;font-size:.82rem;margin:0}
@media(max-width:600px){#rs{gap:6px!important;padding-left:0!important;padding-right:0!important}#rsCloseBookBtn,#rsmenuBtn{font-size:.72rem!important;padding:7px 9px!important;white-space:nowrap}#rsPanel{width:min(270px,calc(100vw - 28px))!important;max-height:55vh!important;right:0!important;top:calc(46px + env(safe-area-inset-top,0px))!important}#pe{padding:0 12px!important}#ep{padding-bottom:24px}}

- 36px));max-height:58vh;overflow:auto;padding:10px;background:var(--card);color:var(--ink);border:1px solid var(--soft);border-radius:16px;box-shadow:0 8px 28px #0005;gap:6px;align-items:center;flex-wrap:wrap"><button class="b" onclick="notesOpen()">📝 Notas</button><button class="b" onclick="hlAdd()">🖍 Resaltar</button><button class="b" onclick="wordOpen()">📖 Palabra</button><button class="b" onclick="findOpen()">🔎 Buscar</button><button class="b" id="pbtn" onclick="paraToggle()">¶ Párrafos</button><button class="b" onclick="timerOpen()">⏱ Temporizador</button><button class="b" onclick="trOpen()">🌐 Traducir</button><button class="b" onclick="rsSz(-1)">A−</button><button class="b" onclick="rsSz(1)">A+</button><select id="rbg" style="width:auto" onchange="rsSet('bg',this.value)"><option value="claro">Claro</option><option value="sepia">Sepia</option><option value="oscuro">Oscuro</option><option value="verde">Verde suave</option><option value="gris">Gris</option></select><select id="rff" style="width:auto" onchange="rsSet('ff',this.value)"></select><label class="b" style="padding:7px 10px">＋ Fuente<input type="file" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="addFont(this.files[0])"></label></div></div><div id="ep" style="max-width:560px;margin:auto;line-height:1.6"></div><div style="position:sticky;bottom:0;background:inherit;padding:10px;text-align:center"><button class="b" onclick="epGo(-1)">◀</button> <span id="epn"></span> <button class="b" onclick="epGo(1)">▶</button></div></div></div>

<script>
const G=['Fantasía','Misterio','Romance','Ciencia ficción','Historia','Cocina','Infantil','Otros'];
const REAL=[['Don Quijote de la Mancha','Miguel de Cervantes','Historia','Cervantes quijote'],['Frankenstein','Mary Shelley','Ciencia ficción','Shelley frankenstein'],['Drácula','Bram Stoker','Fantasía','Stoker dracula'],['Alicia en el país de las maravillas','Lewis Carroll','Fantasía','Carroll alicia'],['Estudio en escarlata','Arthur Conan Doyle','Misterio','Doyle escarlata'],['La Odisea','Homero','Fantasía','Homero odisea'],['Romeo y Julieta','William Shakespeare','Romance','Shakespeare romeo'],['Veinte mil leguas de viaje submarino','Julio Verne','Ciencia ficción','Verne leguas'],['Orgullo y prejuicio','Jane Austen','Romance','Austen orgullo'],['Las aventuras de Tom Sawyer','Mark Twain','Infantil','Twain sawyer'],['Los crímenes de la calle Morgue','Edgar Allan Poe','Misterio','Poe morgue'],['La guerra de los mundos','H. G. Wells','Ciencia ficción','Wells mundos'],['Peter Pan','J. M. Barrie','Infantil','Barrie peter pan'],['El arte de la guerra','Sun Tzu','Historia','Sun Tzu arte guerra'],['Lazarillo de Tormes','Anónimo','Otros','lazarillo'],['Cuento de Navidad','Charles Dickens','Fantasía','Dickens christmas carol']];
const POOL=REAL.map(r=>[r[0],r[2]]);
const KW={'Fantasía':/dragón|mago|magia|reino|hechic|elfo|espada/i,'Misterio':/asesin|crimen|detective|misterio|desaparec|secreto/i,'Romance':/amor|romance|boda|corazón|beso/i,'Ciencia ficción':/nave|espacio|robot|futuro|planeta|alien/i,'Historia':/guerra|siglo|imperio|histor|revoluci/i,'Cocina':/receta|cocina|plato|ingrediente|hornear/i,'Infantil':/niño|niña|cuento|conejo/i};
let S,tab='tienda',mode='dp',sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const guess=t=>{for(const g in KW)if(KW[g].test(t))return g;return 'Otros'};
const val=b=>b.c==='nuevo'?2:1;
const price=b=>b.c==='nuevo'?12:5;
function gen(){return [...REAL].filter(r=>!own().some(b=>b.t===r[0])).sort(()=>Math.random()-.5).slice(0,4).map(r=>({id:'o'+r[0],t:r[0],a:r[1],g:r[2],r}))}
function load(){try{S=JSON.parse(localStorage.getItem('bibcozy'))}catch(e){}
 if(!S){S={coins:20,box:[],sh:{},n:0,mode:'relax',served:0};G.forEach(g=>S.sh[g]=[])}
 fixS();S.offers=gen()}
function save(){try{localStorage.setItem('bibcozy',JSON.stringify(pack()))}catch(e){}cloudSave()}
const own=()=>S.box.concat(...G.map(g=>S.sh[g]));
function say(t){document.getElementById('msg').textContent=t;document.getElementById('toast').textContent=t;const p=document.getElementById('pt');if(p){p.textContent=t;p.style.opacity=1;clearTimeout(window._pt);window._pt=setTimeout(()=>p.style.opacity=0,3500)}}
function setTab(t){tab=t;sel=null;render();if(t==='ami')loadSocial();if(t==='preg'){loadRank();loadFQ()}if(t==='club')loadClubs();if(t!=='ami')stopChat();else if(FR.chat){stopChat();chatT=setInterval(loadChat,6000);loadChat()}}
function setMode(m){mode=m;render()}
function addBook(){
 let b;
 if(mode==='real'){const t=f('t').trim();if(!t)return say('Escribe el título del libro.');
  b={t,a:f('a').trim()||'Autor/a desconocido/a',g:f('g'),m:'real',lang:f('lg').trim(),ed:f('ed').trim(),pub:f('pb').trim()}}
 else{const s=f('s').trim();if(!s)return say('Escribe el resumen.');
  S.n++;b={t:f('t').trim()||'Libro sin título #'+S.n,a:'—',g:guess(s),s,m:'resumen'}}
 const pf=mode==='real'&&document.getElementById('pdf').files[0];if(pf&&!document.getElementById('pd').checked)return say('Marca la casilla: el archivo debe ser de dominio público o propio.');b.c=f('c');b.v=document.getElementById('vs').checked;b.id='b'+Date.now();if(pf){b.pdf=pf.name;putPdf(b.id,pf);if(/\.epub$/i.test(pf.name))epubMeta(pf).then(m=>applyMeta(b,m))}S.box.push(b);save();
 say('📦 "'+b.t+'" llegó a la caja ('+b.g+', '+b.c+').');tab='caja';render()}
const f=id=>document.getElementById(id).value;
function buy(i){const o=S.offers[i],p=price(o);if(S.coins<p)return say('No te alcanzan las monedas 🪙');
 S.coins-=p;S.offers.splice(i,1);S.box.push(o);save();say('Compraste "'+o.t+'" por '+p+' 🪙. Está en la caja.');render()}
function barter(i){const o=S.offers[i],id=f('bt'+i);if(!id)return say('Elige uno de tus libros para el trueque.');
 const mine=own().find(b=>b.id===id);
 if(val(mine)<val(o))return say('Ese libro usado vale menos que uno nuevo. Ofrece uno nuevo.');
 S.box=S.box.filter(b=>b.id!==id);G.forEach(g=>S.sh[g]=S.sh[g].filter(b=>b.id!==id));
 S.offers.splice(i,1);S.box.push(o);save();say('🤝 Trueque hecho: "'+mine.t+'" por "'+o.t+'".');render()}
function pick(id){sel=sel===id?null:id;render()}
function shelve(g){const b=S.box.find(x=>x.id===sel);if(!b)return;
 if(b.g!==g)return say('Mmm, "'+b.t+'" no parece ir en '+g+'.');
 S.box=S.box.filter(x=>x.id!==sel);S.sh[g].push(b);sel=null;save();say('✨ "'+b.t+'" ahora está en '+g+'.');render()}
function newVisitors(){S.offers=gen();render()}
function render(){
 document.querySelector('#menu h1').textContent='📖 Menú';
 document.getElementById('nav').innerHTML=[['tienda','📚 Catálogo'],['add','➕ Añadir'],['caja','📦 Caja ('+S.box.length+')'],['est','🗄️ Estantes'],['cli','🧑 Visitante'+(C?' ●':'')],['cta','☁️ Cuenta'],['ami','👥 Amigos'],['per','🏅 Perfil'],['preg','❓ Preguntas'],['deco','🎨 Decoración'],['bib','📚 Bibliotecas'],['club','📖 Club'],['amb','🎧 Ambiente'],['buscar','🔍 Mi biblioteca'],['col','🗂 Colecciones'],['rec','✨ Recomendados'],['voc','🔤 Vocabulario'],['aud','🎧 Audiolibros'],['mis','📜 Misiones']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
 let h='';
 if(tab==='tienda'){h=shopView();}else if(tab==='add'){
  h=`<div class="row"><button class="b" style="opacity:${mode==='real'?1:.5}" onclick="setMode('real')">Libro propio</button><button class="b" style="opacity:${mode==='dp'?1:.5}" onclick="setMode('dp')">🔎 Dominio público</button></div><div class="card">`+
  (mode==='real'?`<input id="t" placeholder="Título"><input id="a" placeholder="Autor/a"><input id="lg" placeholder="Idioma (opcional)"><input id="ed" placeholder="Edición (opcional)"><input id="pb" placeholder="Editorial (opcional)"><small>PDF o EPUB del libro completo (opcional)</small><input id="pdf" type="file" accept="application/pdf,.epub,application/epub+zip"><label style="display:block;font-size:.85rem"><input id="pd" type="checkbox" style="width:auto"> Es de dominio público o propio</label><select id="g">${G.map(g=>`<option>${g}</option>`).join('')}</select>`
   :`<input id="t" placeholder="Título (opcional)"><textarea id="s" rows="5" placeholder="Escribe el resumen; el juego adivina el género"></textarea>`)+
  `<select id="c"><option>nuevo</option><option>usado</option></select><label style="display:block;font-size:.85rem"><input id="vs" type="checkbox" checked style="width:auto"> Visible para mis amigos</label><button class="b" onclick="addBook()">Añadir a la caja</button></div>`;
 if(mode==='dp')h=dpView();}else if(tab==='caja'){
  h=S.box.map(b=>`<div class="card ${sel===b.id?'sel':''}" onclick="pick('${b.id}')">${cover(b)}<b>${esc(b.t)}</b> <small>${esc(b.a)} · ${b.c} · ${b.m}</small> <button class="b" data-i="${b.id}" onclick="event.stopPropagation();showInfo(this.dataset.i)">ℹ️</button>${b.pdf?`<button class="b" data-i="${b.id}" onclick="event.stopPropagation();readPdf(this.dataset.i)">📄 Leer</button>`:''}${b.s?`<br><small>${esc(b.s.slice(0,90))}…</small>`:''}</div>`).join('')||'<div class="card">La caja está vacía.</div>';
  if(sel)h+='<div class="card">Elige el estante:<div class="row">'+G.map(g=>`<button class="b" onclick="shelve('${g}')">${g}</button>`).join('')+'</div></div>';
 }else if(tab==='cli'){h=cliView()}else if(tab==='cta'){h=ctaView()}else if(tab==='ami'){h=amiView()}else if(tab==='per'){h=perView()}else if(tab==='preg'){h=pregView()}else if(tab==='deco'){h=decoView()}else if(tab==='bib'){h=bibView()}else if(tab==='club'){h=clubView()}else if(tab==='amb'){h=ambView()}else if(tab==='buscar'){h=bfView()}else if(tab==='col'){h=colView()}else if(tab==='rec'){h=recView()}else if(tab==='voc'){h=vocView()}else if(tab==='aud'){h=audView()}else if(tab==='mis'){h=misView()}else{
  h=G.map(g=>`<div class="card"><b>${g}</b> <small>(${S.sh[g].length})</small><br>${S.sh[g].map(b=>'<small>• '+esc(b.t)+'</small> <button class="b" data-i="'+b.id+'" onclick="showInfo(this.dataset.i)">ℹ️</button>'+(b.pdf?'<button class="b" data-i="'+b.id+'" onclick="readPdf(this.dataset.i)">📄</button>':'')).join('<br>')}</div>`).join('');
 }
 document.getElementById('v').innerHTML=h;try{msCheckAll();rebuild();navUI()}catch(e){}
}
const COL=[0x7b4fa0,0x3a6ea5,0xc2556b,0x2f9e8f,0xb8863b,0xd9822b,0x78b04a,0x8a8a8a];
let R,SC,CAM,DYN;const RAY=new THREE.Raycaster();
function mk(x,y,z,w,h,d,c,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);(p||SC).add(m);m.castShadow=true;m.receiveShadow=true;return m}
function setCam(yaw){CAM.position.set(Math.sin(yaw)*5.2,2.6,Math.cos(yaw)*5.2);CAM.lookAt(0,1.3,0)}
function init3d(){
 const el=document.getElementById('sc'),w=el.clientWidth||360,h=el.clientHeight||300;
 SC=new THREE.Scene();SC.background=new THREE.Color(0x3a2a1e);
 CAM=new THREE.PerspectiveCamera(38,w/h,.1,60);setCam(0);
 R=new THREE.WebGLRenderer({antialias:true});R.setSize(w,h);R.outputEncoding=THREE.sRGBEncoding;
 R.domElement.style.touchAction='none';R.domElement.style.cssText+=';width:100%;height:100%';el.appendChild(R.domElement);

 const readB=own().filter(hasRead),pool=readB.length?readB:own(),authors=[...new Set(pool.map(b=>b.a).filter(a=>a&&!['—','Desconocido','Anónimo','Autor/a desconocido/a'].includes(a)))].slice(-3),gc={};
 pool.forEach(b=>{gc[b.g]=(gc[b.g]||0)+1});const tg=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0],jobs=authors.map(a=>({q:a,why:'Del mismo autor: '+a,g:tg?tg[0]:'Otros'}));
 if(tg)jobs.push({topic:GTOP[tg[0]]||'adventure',why:'Porque lees '+tg[0],g:tg[0]});if(!jobs.length)jobs.push({topic:'adventure',why:'Un clásico para empezar',g:'Otros'});
 const owned=new Set(own().map(b=>(b.t||'').toLowerCase())),out=[];
 for(const j of jobs){for(const lg of [PL||'es','']){try{const {data}=await SB.functions.invoke('rapid-processor',{body:{q:j.q||'',topic:j.topic||'',lang:lg,src:'gutenberg'}});
   const L=(Array.isArray(data)?data:[]).filter(x=>x.epub&&!owned.has((x.title||'').toLowerCase()));
   if(L.length){L.slice(0,4).forEach(x=>{if(!out.some(y=>y.id===x.id))out.push(Object.assign({why:j.why,g:j.g},x))});break}}catch(e){}}}
 RC=out;say(out.length?'✨ Encontré '+out.length+' recomendaciones.':'No encontré recomendaciones nuevas ahora.');render()}
async function addRec(i){const r=RC&&RC[i];if(!r||!SB||!U)return;say('Descargando…');
 try{const {data,error}=await SB.functions.invoke('rapid-processor',{body:{url:r.epub}});if(error||!data)throw error||new Error('vacío');
  const file=new File([data],r.title.slice(0,60).replace(/[\/\\]/g,'-')+'.epub',{type:'application/epub+zip'});
  const b={t:r.title,a:r.author||'Desconocido',g:r.g||'Otros',c:'nuevo',m:'real',v:true,id:'b'+Date.now(),pdf:file.name,lang:langName((r.lang||[])[0]),pub:r.src||'',cov:r.cover||''};
  S.box.push(b);putPdf(b.id,file);epubMeta(file).then(m=>applyMeta(b,m));findCover(b.id,true);RC.splice(i,1);save();say('📚 "'+b.t+'" se añadió a tu biblioteca.');render()}
 catch(e){say('No se pudo descargar: '+await errMsg(e))}}

 const L=own().filter(b=>(!q||nrm(b.t).includes(q)||nrm(b.a).includes(q))&&(!BF.lang||(b.lang||'')===BF.lang)&&(!BF.g||b.g===BF.g)&&(!BF.st||(BF.st==='lei'?hasRead(b):BF.st==='por'?!hasRead(b):!!S.fav[b.id]))&&(!BF.col||(S.cols[BF.col]||[]).includes(b.id)));

let TM=null,tmI=null;
const tmFmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function timerOpen(){const e=document.getElementById('tm');if(e){e.remove();return}
 if(TM)sheet('tm',`<b>⏱ Sesión en curso</b><br><span id="tmc" style="font-size:1.6rem">${tmFmt(TM.end-Date.now())}</span><div class="row"><button class="b" onclick="timerStop()">Terminar ahora</button><button class="b" onclick="document.getElementById('tm').remove()">Cerrar</button></div>`);
 else sheet('tm',`<b>⏱ Temporizador de lectura</b><br><small>Lee sin distracciones; al terminar suena un aviso suave y cuenta en tus estadísticas.</small><div class="row">${[15,25,45].map(m=>`<button class="b" onclick="timerStart(${m})">${m} min</button>`).join('')}</div><div class="row"><button class="b" onclick="document.getElementById('tm').remove()">Cerrar</button></div>`)}
function timerStart(m){TM={start:Date.now(),end:Date.now()+m*60000,dur:m};const e=document.getElementById('tm');if(e)e.remove();
 let b=document.getElementById('tmb');if(!b){b=document.createElement('div');b.id='tmb';b.style.cssText='position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;background:#000a;color:#fff;padding:4px 12px;border-radius:999px;font-size:13px;pointer-events:none';document.getElementById('pv').appendChild(b)}
 clearInterval(tmI);tmI=setInterval(timerTick,1000);timerTick();say('⏱ Sesión de '+m+' minutos iniciada.')}
function timerTick(){if(!TM)return;const left=TM.end-Date.now(),b=document.getElementById('tmb'),c=document.getElementById('tmc');if(b)b.textContent='⏱ '+tmFmt(left);if(c)c.textContent=tmFmt(left);if(left<=0)timerEnd(true)}
function timerEnd(ok){if(!TM)return;const min=Math.round((Math.min(Date.now(),TM.end)-TM.start)/60000);S.sess.push({ts:Date.now(),min,ok:!!ok});TM=null;clearInterval(tmI);const b=document.getElementById('tmb');if(b)b.remove();save();dayTick();
 if(ok){chime();sheet('tm',`<b>🔔 ¡Sesión completa!</b><br>Leíste ${min} minutos. Es un buen momento para estirarte y descansar 5 minutos.<div class="row"><button class="b" onclick="document.getElementById('tm').remove()">Seguir leyendo</button></div>`)}else say('Sesión terminada: '+min+' minutos.')}
function timerStop(){timerEnd(false);const e=document.getElementById('tm');if(e)e.remove()}
function chime(){const c=acx();if(!c)return;[523.3,659.3,784].forEach((fr,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.25;o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+1.2);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.3)})}

function msBlock(){const d=MS[C.n];if(!d)return '';const m=S.ms.find(x=>x.k===C.n);
 if(m)return `<div style="margin-top:8px"><small>📜 ${m.done?'Misión cumplida: '+esc(d.n):'Misión activa: '+esc(d.t)}</small></div>`;
 return `<div style="margin-top:8px">📜 <b>Misión:</b> ${esc(d.t)}<div class="row"><button class="b" onclick="msAccept()">Aceptar misión</button></div><small>Recompensa: trofeo ${esc(d.e)} ${esc(d.n)}</small></div>`}
function misView(){const act=S.ms.filter(m=>!m.done),done=S.ms.filter(m=>m.done);
 let h=`<div class="card"><b>📜 Misiones</b><br><small>Los visitantes te las ofrecen después de responder su pregunta. Puedes tener 3 activas. Cada trofeo aparece sobre las estanterías de la sala.</small></div>`;
 h+=act.map(m=>{const d=MS[m.k],r=d.chk(m),pct=Math.round(100*r.p/r.g);return `<div class="card"><b>${esc(d.e)} ${esc(m.k)}</b><br>${esc(d.t)}<div style="background:var(--soft);border-radius:8px;height:8px;margin:6px 0"><div style="width:${pct}%;background:var(--acc);height:8px;border-radius:8px"></div></div><small>${r.p} de ${r.g}</small></div>`}).join('')||'<div class="card"><small>No tienes misiones activas. Responde la pregunta de un visitante para recibir una.</small></div>';
 h+=`<div class="card"><b>🏆 Trofeos (${trophyList().length})</b><br>${trophyList().map(([e,n])=>`<div>${esc(e)} ${esc(n)}</div>`).join('')||'<small>Aún no tienes trofeos.</small>'}</div>`;return h}
/* ---- audiolibros (LibriVox) ---- */
let AUR=null,AUB=null,AUS=0,AUA=null;
function audEl(){if(!AUA){AUA=new Audio();AUA.preload='none';AUA.addEventListener('ended',()=>audNext());AUA.addEventListener('timeupdate',audProg);AUA.addEventListener('play',audProg);AUA.addEventListener('pause',audProg)}return AUA}
async function audSearch(){const q=f('auq').trim();if(!q)return;if(!SB||!U)return say('Entra primero en ☁️ Cuenta.');say('🎧 Buscando audiolibros…');
 try{const {data,error}=await SB.functions.invoke('rapid-processor',{body:{lv:q}});if(error)throw error;AUR=Array.isArray(data)?data:[];AUB=null;say(AUR.length?'':'No encontré audiolibros. Prueba con el inicio del título o el apellido del autor.');render()}
 catch(e){say('No se pudo buscar: '+await errMsg(e))}}
function audOpen(i){AUB=AUR[i];render()}
function audPlay(si,t){const b=AUB;if(!b||!b.sections[si])return;AUS=si;const a=audEl();a.src=b.sections[si].url;a.playbackRate=S.au.rate||1;a.onloadedmetadata=()=>{if(t)a.currentTime=t};a.play().catch(()=>say('No se pudo reproducir esa sección.'));S.au.cur={bk:b.id,t:b.title,s:si};save();render()}
function audNext(){if(AUB&&AUS+1<AUB.sections.length)audPlay(AUS+1)}
function audToggle(){const a=audEl();if(!a.src)return;if(a.paused)a.play();else a.pause()}
function audSeek(d){const a=audEl();if(a.src)a.currentTime=Math.max(0,a.currentTime+d)}
function audRate(v){S.au.rate=+v;audEl().playbackRate=+v;save()}
function audProg(){const a=AUA,e=document.getElementById('aup');if(e&&a)e.textContent=tmFmt(a.currentTime*1000)+' / '+tmFmt((a.duration||0)*1000)+(a.paused?' ⏸':' ▶');if(a&&AUB&&Math.floor(a.currentTime)%10===0&&a.currentTime>1)S.au.pos[AUB.id]={s:AUS,t:Math.floor(a.currentTime)}}
function audView(){const cur=S.au.cur;
 let h=`<div class="card"><b>🎧 Audiolibros</b><br><small>Grabaciones gratuitas de dominio público de LibriVox, leídas por voluntarios. Escribe el inicio del título o el apellido del autor. Escuchar también cuenta en tus estadísticas.</small><input id="auq" placeholder="Ej.: Don Quijote, Dracula, Verne" onkeydown="if(event.key==='Enter')audSearch()"><div class="row"><button class="b" onclick="audSearch()">Buscar</button></div></div>`;
 if(AUA&&AUA.src&&AUB)h+=`<div class="card"><b>▶ Ahora suena</b><br>${esc(AUB.title)} <small>· sección ${AUS+1} de ${AUB.sections.length}</small><div id="aup" style="margin:6px 0">${tmFmt(AUA.currentTime*1000)} / ${tmFmt((AUA.duration||0)*1000)}${AUA.paused?' ⏸':' ▶'}</div><div class="row"><button class="b" onclick="audSeek(-15)">⏪ 15</button><button class="b" onclick="audToggle()">⏯</button><button class="b" onclick="audSeek(15)">15 ⏩</button><button class="b" onclick="audNext()">Siguiente</button></div><small>Velocidad</small><select onchange="audRate(this.value)">${[.75,1,1.25,1.5,2].map(v=>`<option value="${v}"${(S.au.rate||1)===v?' selected':''}>${v}x</option>`).join('')}</select></div>`;
 else if(cur)h+=`<div class="card"><small>Última escucha: ${esc(cur.t)} (sección ${cur.s+1}). Búscalo de nuevo para continuar.</small></div>`;
 if(AUB){h+=`<div class="card"><b>${esc(AUB.title)}</b><br><small>${esc(AUB.author||'')} · ${esc(AUB.lang||'')} · ${esc(AUB.time||'')}</small><div class="row"><button class="b" onclick="AUB=null;render()">Volver a los resultados</button></div></div>`;
  const ps=S.au.pos[AUB.id];if(ps)h+=`<div class="card"><button class="b" onclick="audPlay(${ps.s},${ps.t})">Continuar en la sección ${ps.s+1} (${tmFmt(ps.t*1000)})</button></div>`;
  h+=AUB.sections.map((x,i)=>`<div class="card" style="padding:8px 12px"><button class="b" onclick="audPlay(${i})">▶</button> ${esc(x.title||'Sección '+(i+1))} <small>${tmFmt((x.secs||0)*1000)}</small></div>`).join('')}
 else if(AUR)h+=AUR.map((b,i)=>`<div class="card"><b>${esc(b.title)}</b><br><small>${esc(b.author||'')} · ${esc(b.lang||'')} · ${esc(b.time||'')} · ${b.sections.length} secciones</small><div class="row"><button class="b" onclick="audOpen(${i})">Abrir</button></div></div>`).join('')||'<div class="card"><small>Sin resultados.</small></div>';
 return h}
/* ---- traduccion y modo bilingue (MyMemory) ---- */
const TRC={};
function chunkText(t,max){const ss=t.match(/[^.!?…]+[.!?…]+["»”')\]]*\s*|[^.!?…]+$/g)||[t],out=[];let acc='';ss.forEach(x=>{while(x.length>max){if(acc){out.push(acc);acc=''}out.push(x.slice(0,max));x=x.slice(max)}if(acc&&acc.length+x.length>max){out.push(acc);acc=x}else acc+=x});if(acc)out.push(acc);return out}
function srcLang(){const b=own().find(x=>x.id===RB);return LNGC[(b&&b.lang)||'']||'en'}
async function trText(text,src,tgt){if(src===tgt)throw new Error('el libro ya está en ese idioma; elige otro idioma de destino');let out='';const ta=document.createElement('textarea');
 for(const c of chunkText(text,430)){const k=src+tgt+c;if(TRC[k]){out+=TRC[k]+' ';continue}
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(c)+'&langpair='+src+'|'+tgt+(RS.trMail?'&de='+encodeURIComponent(RS.trMail):'')),j=await r.json();
  const tx=(j.responseData&&j.responseData.translatedText)||'';if(/USED ALL AVAILABLE|QUERY LENGTH LIMIT/i.test(tx)||(+j.responseStatus>=400))throw new Error(/USED ALL/i.test(tx)?'se acabó el límite gratuito de hoy (puedes añadir tu correo en el panel Traducir para ampliarlo)':(j.responseDetails||'error'));
  ta.innerHTML=tx;TRC[k]=ta.value;out+=ta.value+' '}return out.trim()}
function trSet(k,v){RS[k]=v;rsSave()}
function trOpen(){sheet('tr',`<b>🌐 Traducir</b><br><small>Traduce con el servicio gratuito MyMemory. Con el modo bilingüe activo, toca un párrafo del libro para ver su traducción debajo.</small>
 <select onchange="trSet('tl',this.value)">${[['es','Traducir a español'],['en','Traducir a inglés'],['fr','Traducir a francés'],['de','Traducir a alemán'],['it','Traducir a italiano'],['pt','Traducir a portugués']].map(([v,n])=>`<option value="${v}"${RS.tl===v?' selected':''}>${n}</option>`).join('')}</select>
 <input placeholder="Tu correo (opcional, amplía el límite diario)" value="${esc(RS.trMail||'')}" onchange="trSet('trMail',this.value.trim())">
 <div class="row"><button class="b" onclick="trSel()">Traducir selección</button><button class="b" onclick="biToggle()">Modo bilingüe: ${RS.bi?'sí':'no'}</button><button class="b" onclick="document.getElementById('tr').remove()">Cerrar</button></div><div id="tro" style="margin-top:8px"></div>`)}
function biToggle(){RS.bi=!RS.bi;rsSave();trOpen();say(RS.bi?'🌐 Modo bilingüe: toca un párrafo para traducirlo.':'🌐 Modo bilingüe desactivado.')}
async function trSel(){const o=document.getElementById('tro'),t=(LASTSEL||'').trim();if(!o)return;if(!t){o.textContent='Primero selecciona un texto del libro.';return}o.textContent='Traduciendo…';
 try{o.innerHTML='<b>'+esc(t.slice(0,120))+(t.length>120?'…':'')+'</b><br>'+esc(await trText(t,srcLang(),RS.tl))}catch(e){o.textContent='No se pudo traducir: '+(e.message||e)}}
async function biPara(p){const n=p.nextSibling;if(n&&n.className==='tr'){n.remove();return}const d=document.createElement('div');d.className='tr';d.style.cssText='margin:-6px 0 12px;padding:6px 10px;border-left:3px solid var(--acc);font-style:italic;opacity:.9';d.textContent='Traduciendo…';p.after(d);
 try{d.textContent=await trText(p.textContent,srcLang(),RS.tl)}catch(e){d.textContent='No se pudo traducir: '+(e.message||e)}}
let AMBL,HEML,LP,BLOOMP;
const VIS_DEF={bright:1,amb:1,key:1,candle:1,expo:1.15,warm:0,shadow:1,bloom:.4,res:0,fov:38,dist:0,alt:0,dust:1};
const VZ=k=>(typeof S!=='undefined'&&S&&S.vis&&S.vis[k]!==undefined)?S.vis[k]:VIS_DEF[k];
const VSL=[['bright','Brillo general',.4,2,.05],['amb','Luz ambiente',0,2,.05],['key','Luz de la ventana',0,2.5,.05],['candle','Velas y araña',0,2.5,.05],['expo','Exposición',.5,2,.05],['warm','Frío ← → cálido',-1,1,.05],['bloom','Brillo de luces (solo calidad alta)',0,1.5,.05],['res','Resolución (0 = automática)',0,2,.25],['fov','Campo de visión',25,70,1],['dist','Distancia de la cámara',-2.5,4,.1],['alt','Altura de la cámara',-.6,1.6,.05]];
const VIS_PRE={'Cálido':{warm:.5,candle:1.1,amb:1,key:1,bright:1,expo:1.15},'Claro':{bright:1.35,amb:1.4,key:1.2,candle:.8,warm:.1,expo:1.3},'Nocturno':{bright:.7,amb:.5,key:.4,candle:1.8,warm:.6,expo:1.1},'Contraste':{bright:1,amb:.5,key:1.6,candle:1,warm:0,expo:1,bloom:.6}};
function tint(hex){const c=new THREE.Color(hex),w=VZ('warm');if(w>0)c.lerp(new THREE.Color(0xffc080),w*.5);else if(w<0)c.lerp(new THREE.Color(0x9fc4ff),-w*.5);return c}
function applyVis(heavy){if(!R)return;const b=VZ('bright'),q=GQ();
 if(AMBL){AMBL.intensity=.25*VZ('amb')*b;AMBL.color.copy(tint(0xffe2b8))}if(HEML){HEML.intensity=.55*VZ('amb')*b;HEML.color.copy(tint(0xfff3dc))}if(LP)LP.intensity=1.2*b;
 if(!COMP)R.toneMappingExposure=VZ('expo');if(BLOOMP)BLOOMP.strength=VZ('bloom');
 const sh=q!=='bajo'&&VZ('shadow')>0;R.shadowMap.enabled=sh;if(KEYL)KEYL.castShadow=sh;if(DUST)DUST.visible=VZ('dust')>0;
 if(CAM){CAM.fov=VZ('fov');CAM.updateProjectionMatrix()}
 if(heavy){const el=document.getElementById('sc'),pr=VZ('res')||(q==='alto'?Math.min(window.devicePixelRatio||1,2):q==='medio'?Math.min(window.devicePixelRatio||1,1.5):1);R.setPixelRatio(pr);R.setSize(el.clientWidth||360,el.clientHeight||300,false);if(COMP)COMP.setSize(el.clientWidth||360,el.clientHeight||300)}
 if(typeof applyTime==='function')applyTime()}
function visSet(k,v){S.vis[k]=+v;const l=document.getElementById('vl_'+k);if(l)l.textContent=(+v).toFixed(2);applyVis(k==='res'||k==='shadow')}
function visPre(n){S.vis=Object.assign({},VIS_PRE[n]);save();applyVis(true);visBuild()}
function visReset(){S.vis={};save();applyVis(true);visBuild()}
function visCopy(){const j=JSON.stringify(Object.assign({},VIS_DEF,S.vis,{calidad:GQ(),ancho:window.innerWidth,alto:window.innerHeight,dpr:window.devicePixelRatio||1}));
 try{navigator.clipboard.writeText(j).then(()=>say('📋 Ajustes copiados.'),()=>prompt('Copia tus ajustes:',j))}catch(e){prompt('Copia tus ajustes:',j)}}
function visPaste(){const t=prompt('Pega los ajustes (texto JSON):');if(!t)return;try{const o=JSON.parse(t);Object.keys(VIS_DEF).forEach(k=>{if(typeof o[k]==='number')S.vis[k]=o[k]});save();applyVis(true);visBuild()}catch(e){say('Ese texto no es válido.')}}
function visBuild(){const p=document.getElementById('vis');if(!p)return;
 p.innerHTML=`<b>🛠 Ajustes visuales</b> <small>(se guardan solos)</small><div class="row" style="margin:6px 0">${Object.keys(VIS_PRE).map(n=>`<button class="b" onclick="visPre('${n}')">${n}</button>`).join('')}</div>`
 +VSL.map(([k,l,mn,mx,st])=>`<div style="margin:4px 0"><small>${l}: <b id="vl_${k}">${(+VZ(k)).toFixed(2)}</b></small><input id="vs_${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${VZ(k)}" oninput="visSet('${k}',this.value)" onchange="save()"></div>`).join('')
 +`<div class="row"><button class="b" onclick="visSet('shadow',VZ('shadow')?0:1);save();visBuild()">Sombras: ${VZ('shadow')?'sí':'no'}</button><button class="b" onclick="visSet('dust',VZ('dust')?0:1);save();visBuild()">Polvo: ${VZ('dust')?'sí':'no'}</button></div><div class="row" style="margin-top:6px"><button class="b" onclick="visReset()">Restablecer</button><button class="b" onclick="visCopy()">Copiar ajustes</button><button class="b" onclick="visPaste()">Pegar ajustes</button><button class="b" onclick="visToggle()">Cerrar</button></div>`}
function visToggle(){let p=document.getElementById('vis');if(p){p.remove();return}p=document.createElement('div');p.id='vis';p.style.cssText='position:absolute;left:8px;right:8px;bottom:44px;max-height:46%;overflow:auto;background:var(--card);color:var(--ink);padding:10px 12px;border-radius:16px;box-shadow:0 4px 18px #0007;z-index:6;opacity:.95';document.getElementById('sc').appendChild(p);visBuild()}
const BSEL=new Set();
function bfSel(id,on){if(on)BSEL.add(id);else BSEL.delete(id);bfSet('q',BF.q)}
async function delBook(id,ask){const b=own().find(x=>x.id===id);if(!b)return;
 if(ask!==false&&!confirm('¿Eliminar «'+b.t+'» de tu biblioteca? Se borrarán también su archivo, sus notas y sus subrayados.'))return;
 dropBook(id);delete S.pos[id];delete S.notes[id];delete S.hl[id];delete S.rb[id];delete S.ch[id];BSEL.delete(id);if(S.last&&S.last.id===id)S.last=null;
 try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}
 if(SB&&U){try{await SB.storage.from('books').remove([U.id+'/'+id])}catch(e){}}
 save();const inf=document.getElementById('inf');if(inf)inf.remove();render();if(ask!==false)say('🗑 «'+b.t+'» eliminado de tu biblioteca.')}
async function bfDelSel(){const ids=[...BSEL];if(!ids.length)return;if(!confirm('¿Eliminar '+ids.length+' libro'+(ids.length===1?'':'s')+'? Se borrarán también sus archivos, notas y subrayados.'))return;
 for(const id of ids)await delBook(id,false);BSEL.clear();say('🗑 '+ids.length+' libro'+(ids.length===1?'':'s')+' eliminado'+(ids.length===1?'':'s')+'.')}
let paused=false;
function toggleMenu(){paused=!paused;if(!paused)stopChat();else if(tab==='ami'&&FR.chat){stopChat();chatT=setInterval(loadChat,6000);loadChat()}if(paused&&document.exitPointerLock)document.exitPointerLock();
 
 document.getElementById('menu').style.display=paused?'block':'none';if(paused)render()}
addEventListener('keydown',e=>{if(e.key==='Escape'&&paused)toggleMenu()});

function rebuild(){
 if(!R)return;
 while(DYN.children.length)DYN.remove(DYN.children[0]);
  const lib={por:[],fav:[],lei:[]};own().forEach(b=>{(hasRead(b)?lib.lei:lib.por).push(b);if(S.fav[b.id])lib.fav.push(b)});
 [['por',-4.6],['fav',0],['lei',4.6]].forEach(([k,cx])=>lib[k].slice(0,MODEL_OK?176:40).forEach((b,i)=>spine(b,i,cx)));
 S.box.slice(0,12).forEach((b,i)=>{const m=mk(-2.6+i*.45,b.id===sel?1.5:1.23,1,.38,.08,.52,COL[Math.max(0,G.indexOf(b.g))],DYN);m.userData.id=b.id;
  if(b.id===sel)m.material.emissive=new THREE.Color(0x553311)});trophies3d();
}
load();restoreFonts();initSB();try{init3d()}catch(e){}render();say('Bienvenido/a. Usa las flechas para recorrer tu biblioteca.');
